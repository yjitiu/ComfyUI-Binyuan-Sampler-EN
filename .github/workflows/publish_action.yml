name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install comfy-cli
        run: pip install comfy-cli

      - name: Show repository layout
        run: ls -la custom_nodes/binyuan_sampler_plugin_english

      # Comfy-Org/publish-node-action runs `comfy node publish` at the repo root,
      # which has no pyproject.toml here, so it is not used.
      # The cd happens inside the script: a step-level `working-directory` is
      # resolved before checkout and fails on a fresh runner.
      - name: Publish Custom Node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cd custom_nodes/binyuan_sampler_plugin_english
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
